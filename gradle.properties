org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0 made Kotlin support built-in by default, replacing the separate
# org.jetbrains.kotlin.android plugin this project still uses. These two flags opt back
# into the classic, well-documented setup - see the comment in build.gradle.kts. Google's
# own migration notes say this opt-out is removed in AGP 10.0 (mid-2026): if you're
# building this on AGP 10+, delete both lines below and the kotlin("android") plugin line
# in app/build.gradle.kts, and follow AGP's built-in-Kotlin migration guide instead.
android.builtInKotlin=false
android.newDsl=false
